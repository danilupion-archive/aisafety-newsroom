apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aisafety-newsroom-api.fullname" . }}
  labels:
    {{- include "aisafety-newsroom-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "aisafety-newsroom-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aisafety-newsroom-api.selectorLabels" . | nindent 8 }}
    spec:
      # preStop sleep + time to drain in-flight requests
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ required "image.tag is required" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.service.port | quote }}
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "apiTokenSecret.name is required" .Values.apiTokenSecret.name }}
                  key: {{ .Values.apiTokenSecret.key }}
            - name: APP_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "databaseUrlSecret.name is required" .Values.databaseUrlSecret.name }}
                  key: {{ .Values.databaseUrlSecret.key }}
            {{- with .Values.publicDatabaseUrlSecret }}
            {{- if .name }}
            - name: PUBLIC_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}
                  key: {{ .key }}
            {{- end }}
            {{- end }}
            {{- if or .Values.telegram.secret.name .Values.telegram.allowedUserIds }}
            # The bot takes its secret and its allowlist together (src/config.ts), so one without the other fails here.
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "telegram.secret.name is required with telegram.allowedUserIds" .Values.telegram.secret.name }}
                  key: TELEGRAM_BOT_TOKEN
            - name: TELEGRAM_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.telegram.secret.name }}
                  key: TELEGRAM_WEBHOOK_SECRET
            - name: TELEGRAM_ALLOWED_USER_IDS
              value: {{ required "telegram.allowedUserIds is required with telegram.secret.name" .Values.telegram.allowedUserIds | quote }}
            {{- with .Values.telegram.webhookUrl }}
            - name: TELEGRAM_WEBHOOK_URL
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          lifecycle:
            preStop:
              # Keep serving while the endpoint removal reaches the gateway; SIGTERM arrives after the sleep.
              exec:
                command: ['sleep', '8']
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
