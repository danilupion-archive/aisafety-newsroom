{{- $policy := .Values.networkPolicy | default dict }}
{{- if $policy.enabled }}
{{- /* An empty list or map is falsy: on with no gateway, or a gateway with no labels, would shut every request out
     (Cilium drops, the pods stay Ready), or let every pod of a namespace in. Refuse to render either. */}}
{{- if not $policy.gateways }}
{{- fail "networkPolicy.gateways must list the gateways that bring requests: on without one, nothing reaches the API" }}
{{- end }}
{{- range $policy.gateways }}
{{- if or (not .namespace) (not .podLabels) }}
{{- fail "networkPolicy.gateways[] needs a namespace and podLabels: without labels it would admit every pod there" }}
{{- end }}
{{- end }}
# Who may open a connection to the API's pods (SPEC §5), as aiontheballot's site policy does it: the gateways' Envoy
# pods, which bring /api/v1 and the Telegram webhook (the route routes nothing else), and the site's pods, which alone
# read /public (R-WEB-6). Nothing else in the cluster. Ingress only: what the API reaches (Postgres, Telegram's API) is
# unchanged. The kubelet's probes come from the node, which Cilium always admits (`allow-localhost`).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aisafety-newsroom-api.fullname" . }}
  labels:
    {{- include "aisafety-newsroom-api.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "aisafety-newsroom-api.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range $gateway := $policy.gateways }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $gateway.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml $gateway.podLabels | nindent 14 }}
        {{- end }}
        # The site's pods, in this namespace. The name is the web chart's nameOverride in the umbrella
        # (helm-charts/aisafety-newsroom/values.yaml): rename one, rename both.
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/name: {{ $policy.webName | default "web" }}
      ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
{{- end }}
