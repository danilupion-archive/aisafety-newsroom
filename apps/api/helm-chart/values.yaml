replicaCount: 2
image:
  repository: aisafety-newsroom/api
  tag: ''
  pullPolicy: IfNotPresent
service:
  port: 3001
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

# The bearer token for /api/v1 (R-API-1, R-API-2), sealed in gitops by scripts/seal-gitops-secrets.sh.
apiTokenSecret:
  name: ''
  key: API_TOKEN
# newsroom_app's connection string (SPEC §7), sealed in gitops by scripts/seal-gitops-secrets.sh. Never the owner's.
databaseUrlSecret:
  name: ''
  key: DATABASE_URL
# newsroom_public's connection, for the site's reads (R-WEB-6), sealed by scripts/seal-gitops-secrets.sh. Unset, /public
# answers 503.
publicDatabaseUrlSecret:
  name: ''
  key: DATABASE_URL

# The Telegram bot (SPEC §6). Set the secret and the allowlist together, or neither: without them the webhook answers
# 503, and Telegram keeps the updates.
telegram:
  # TELEGRAM_BOT_TOKEN (from BotFather) and TELEGRAM_WEBHOOK_SECRET, sealed in gitops by scripts/seal-telegram-secret.sh.
  secret:
    name: ''
  # Telegram user ids whose messages count, separated by commas (R-CAP-1).
  allowedUserIds: ''
  # The webhook's public address; when set, the API registers it with Telegram on every start.
  webhookUrl: ''

# The worker (SPEC §8): claims queued items, fetches and extracts them, and edits the bot's replies. The API's image,
# `node dist/worker.js`, with newsroom_app's connection (databaseUrlSecret) and, when the bot is configured, its token.
# One replica, replaced by recreating it. Its NetworkPolicy admits nothing and lets it reach only DNS, the database
# and the public internet on ports 80 and 443 (R-FET-4). Off until gitops turns it on with the database's namespace.
worker:
  enabled: false
  port: 3002
  # Hosts never fetched, separated by commas (R-FET-3).
  skipHosts: x.com
  # Between rounds (R-FET-1: at least once a minute).
  intervalSeconds: 30
  # Days a logged or discarded item keeps its page's text (SPEC Q9); its title and links stay.
  pageTextRetentionDays: 90
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    # jsdom on a 5 MB page or PDF.js on a 30 MB PDF, one at a time.
    limits:
      cpu: '1'
      memory: 1Gi
  # SENTRY_DSN of the GlitchTip project aisafety-newsroom-worker (its own, never the API's). Set
  # networkPolicy.errorTracking too, or its reports can't leave.
  errorTracking:
    dsnSecret:
      name: ''
      key: SENTRY_DSN
  networkPolicy:
    enabled: true
    # The database's namespace and port.
    database:
      namespace: ''
      port: 5432
    # Error tracking inside the cluster (GlitchTip): its namespace, its web pods' labels and their port (the pods',
    # not the Service's: a policy sees the connection after the Service). Without a namespace, no error tracking.
    errorTracking:
      namespace: ''
      podLabels: {}
      port: 8000

# Error tracking (SPEC §15): SENTRY_DSN of the GlitchTip project aisafety-newsroom-api, sealed by
# scripts/seal-glitchtip-dsns.sh. Unset, nothing is reported.
errorTracking:
  dsnSecret:
    name: ''
    key: SENTRY_DSN

# Who may reach the API's pods (SPEC §5): the gateways' Envoy pods (/api/v1, the webhook) and the site's pods (/public);
# nothing else in the cluster. Ingress only. Gitops turns it on with the gateways of its environment.
networkPolicy:
  enabled: false
  # Each gateway whose Envoy pods bring requests: their namespace and their pods' labels, e.g.
  #   - namespace: envoy-gateway-system
  #     podLabels:
  #       gateway.envoyproxy.io/owning-gateway-name: example-gateway
  #       gateway.envoyproxy.io/owning-gateway-namespace: example-gateways
  gateways: []
  # The site's pods' app.kubernetes.io/name: the web chart's nameOverride in the umbrella (web). They must match.
  webName: web

# Extra environment (plain values, or secretKeyRef for credentials sealed in gitops).
env: []
envFrom: []

# The API host (SPEC §5): on the public gateway, routing only the Telegram webhook and /api/v1 to the API. Every
# /api/v1 request needs the bearer token; the webhook needs Telegram's secret token.
route:
  enabled: false
  # e.g. - name: example-gateway
  #        namespace: example-gateways
  parentRefs: []
  hostnames: []
  annotations: {}
  paths:
    - /telegram/webhook
    - /api/v1
