# Rendered in CI (helm lint/template) to exercise every template. Fictional hosts, placeholder secret names.
aisafety-newsroom-migrations:
  image: { repository: registry.example/aisafety-newsroom/migrations, tag: 0.1.0.abc1234 }
  databaseUrlSecret: { name: aisafety-newsroom-owner-db }
aisafety-newsroom-api:
  image: { repository: registry.example/aisafety-newsroom/api, tag: 0.1.0.abc1234 }
  apiTokenSecret: { name: aisafety-newsroom-api-token }
  databaseUrlSecret: { name: aisafety-newsroom-app-db }
  publicDatabaseUrlSecret: { name: aisafety-newsroom-public-db }
  # Renders the API's network policy, so lint covers it.
  networkPolicy:
    enabled: true
    gateways:
      - namespace: example-gateways
        podLabels: { gateway.envoyproxy.io/owning-gateway-name: example-gateway }
  # Renders the worker and its network policy, so lint covers them.
  worker:
    enabled: true
    networkPolicy:
      database: { namespace: example-postgres }
  # Renders the bot's settings, so lint covers them.
  telegram:
    secret: { name: aisafety-newsroom-telegram }
    allowedUserIds: '123456789'
    webhookUrl: https://newsroom-api.example.test/telegram/webhook
  route:
    enabled: true
    parentRefs: [{ name: example-gateway, namespace: example-gateway }]
    hostnames: [newsroom-api.example.test]
aisafety-newsroom-web:
  enabled: true
  image: { repository: registry.example/aisafety-newsroom/web, tag: 0.1.0.abc1234 }
  site:
    { url: https://newsroom-site.example.test, name: Sitio de ejemplo, author: Autora de ejemplo }
  # Renders analytics and the route, so lint covers them.
  analytics:
    { scriptUrl: https://plausible.example.test/js/script.js, domain: newsroom-site.example.test }
  route:
    enabled: true
    parentRefs: [{ name: example-gateway, namespace: example-gateway }]
    hostnames: [newsroom-site.example.test]
